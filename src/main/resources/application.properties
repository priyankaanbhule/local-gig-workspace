# Application Name
spring.application.name=localgig
spring.profiles.default=local

# Server Configuration
server.port=${PORT:${SERVER_PORT:8081}}

# PostgreSQL Database Configuration
spring.datasource.url=${LOCALGIG_DB_URL:jdbc:postgresql://${RDS_HOSTNAME:localhost}:${RDS_PORT:5432}/${RDS_DB_NAME:workplace}}
spring.datasource.username=${LOCALGIG_DB_USERNAME:${RDS_USERNAME:}}
spring.datasource.password=${LOCALGIG_DB_PASSWORD:${RDS_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${LOCALGIG_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# User-upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
localgig.upload-dir=${LOCALGIG_UPLOAD_DIR:uploads}
localgig.opportunities.expiry-check-ms=3600000
localgig.demo-data.enabled=${LOCALGIG_DEMO_DATA_ENABLED:true}
localgig.openai.api-key=${OPENAI_API_KEY:}
localgig.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${LOCALGIG_COOKIE_SECURE:false}

# Password reset email. Set these environment variables to enable real email.
# While disabled, the reset link is printed in the Spring Boot console.
localgig.mail.enabled=${LOCALGIG_MAIL_ENABLED:false}
localgig.frontend-url=${LOCALGIG_FRONTEND_URL:http://localhost:5173}
localgig.mail.from=${LOCALGIG_MAIL_FROM:no-reply@localgig.local}
spring.mail.host=${LOCALGIG_SMTP_HOST:}
spring.mail.port=${LOCALGIG_SMTP_PORT:587}
spring.mail.username=${LOCALGIG_SMTP_USERNAME:}
spring.mail.password=${LOCALGIG_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

